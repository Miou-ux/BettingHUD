map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# CourtAlpha — courtalpha.tech (HTTPS)
server {
    server_name courtalpha.tech www.courtalpha.tech;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    root /opt/courtalpha/frontend/dist;
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/courtalpha.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtalpha.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# BettingHUD Streamlit — admin.courtalpha.tech (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.courtalpha.tech;

    ssl_certificate /etc/letsencrypt/live/courtalpha.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtalpha.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}

# Accès par IP — redirige vers CourtAlpha public
server {
    listen 80;
    listen [::]:80;
    server_name 192.95.30.217;
    return 301 https://courtalpha.tech$request_uri;
}

# admin.courtalpha.tech — HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.courtalpha.tech;
    return 301 https://$host$request_uri;
}

# Legacy :8502 → sous-domaine admin
server {
    listen 8502 ssl;
    listen [::]:8502 ssl;
    server_name courtalpha.tech www.courtalpha.tech admin.courtalpha.tech 192.95.30.217 _;

    ssl_certificate /etc/letsencrypt/live/courtalpha.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtalpha.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://admin.courtalpha.tech$request_uri;
}

# courtalpha.tech — HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name courtalpha.tech www.courtalpha.tech;
    return 301 https://$host$request_uri;
}
